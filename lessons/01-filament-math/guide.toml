# Guided steps for ./scripts/guide. Test phrases are matched against test
# names in every language, ignoring case, underscores and a test_ prefix.
# A hint is either one text, or a table with a text per language and a default.

title = "Filament math"
intro = """
This lesson teaches test-driven development (TDD): the tests come first. They
describe what the code must do, and you write code until they pass. Why it
matters: a passing test is proof you can re-check any time, whoever wrote the
code (you, a teammate, or an AI), and it tells you the moment a change breaks
something.

The setup: a teammate turned the filament maker's data sheet into tests, and
your job is to make them pass. Start by reading what they wrote: the tests are
the spec ("Reading the tests" in the lesson README shows how). In lesson 02 you
swap roles and write the tests yourself.
"""

[files]
php = { edit = "php/filament.php", tests = "php/test.php" }
python = { edit = "python/filament.py", tests = "python/test_filament.py" }
ts = { edit = "ts/filament.ts", tests = "ts/filament.test.ts" }
rust = { edit = "rust/src/lib.rs", tests = "rust/tests/filament.rs" }

[[exercise]]
title = "Read your teammate's tests"
kind = "read"
task = """
Before any code, read the tests you've been handed. You're checking that you
understand what they ask for, the way you would with a teammate's tests.
"""
tests = "all"
learned = "reading tests as the spec, before writing code"
checklist = [
    "Read \"The problem\" in the lesson README",
    "Open the tests file and find the first test: one metre of 1.75 mm PLA weighs about 3 g (the README's \"Reading the tests\" shows how)",
    "Follow the README's \"Worked example\" and see that it ends at 2.98 g, that test's number",
    "Find that test's red ✗ below. It fails because there's no code yet, but it already knows the answer",
]

[[exercise]]
title = "Weight from a length"
task = """
Make the filament_grams tests pass. They say what it must do: give the weight in
grams of a length of filament. The lesson README has the formula. Only the tests
for this function count here.
"""
tests = ["weighs about 3 g", "zero length", "much heavier", "denser material"]
learned = "turning a formula into code, and red → green"
hints = [
    "Turn the README's formula into code one line at a time, with a named variable for each: area, volume in mm³, volume in cm³, weight.",
    { php = "π is M_PI. To square a number: $radius ** 2.", python = "π is math.pi (add import math at the top). To square a number: radius ** 2.", ts = "π is Math.PI. To square a number: radius ** 2.", rust = "π is std::f64::consts::PI. To square a number: radius.powi(2). Write 2.0 and 1000.0, not 2 and 1000: Rust won't mix integers and floats.", default = "Look up how your language writes π and squares a number." },
    "radius = diameter ÷ 2; area = π × radius²; mm³ = area × length; cm³ = mm³ ÷ 1000; grams = cm³ × density. Return grams.",
]

[[exercise]]
title = "Length from a weight"
task = """
Make the filament_length_mm tests pass: the length of filament in a given
weight. It's the first function run backwards.
"""
tests = ["1 kg spool", "back and forth"]
learned = "working a calculation backwards, and reusing what you already wrote"
hints = [
    "If weight = length × (grams per millimetre), then length = weight ÷ (grams per millimetre).",
    "Grams per millimetre is the first function's calculation with a length of 1 mm.",
    "Write a helper, grams_per_mm(diameter, density). Then filament_length_mm returns grams ÷ grams_per_mm(...). That's half of the next step done early.",
]

[[exercise]]
title = "Refactor"
kind = "confirm"
task = """
Every test passes. Now make the code clearer without changing what it does.
Run the tests after each small change; they're your safety net.
"""
tests = "all"
learned = "refactoring with tests as a safety net"
checklist = [
    "Each step of the formula has a named variable",
    "The two functions share the per-millimetre calculation instead of repeating it",
    "The tests still pass",
]

[[exercise]]
title = "A test of your own"
task = """
Add one test of your own to the tests file: one more test than the six you
were given. Work out the expected value by hand before you run it, the same way
as the README's worked example.
"""
tests = "all"
min_tests = 7
learned = "writing a test, with the expected answer worked out independently"
hints = [
    "Copy an existing test and change the inputs. TPU has a density of about 1.21 g/cm³.",
    "Work out the expected value with a calculator first, then type it into the test. A test that copies the code's own answer proves nothing.",
    "One metre of 1.75 mm TPU: 2.405 cm³ × 1.21 ≈ 2.91 g.",
]
