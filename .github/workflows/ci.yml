name: CI

on:
  push:
  pull_request:

jobs:
  # Formatting, linting and type checks run everywhere, including the
  # unsolved stubs on main.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: PHP syntax
        run: find lessons -name '*.php' -not -path '*/vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Python lint and format
        run: pipx run ruff check . && pipx run ruff format --check .
      - name: TypeScript type check
        run: npm ci && npm run typecheck
      - name: Rust format and lint
        run: cargo fmt --all --check && cargo clippy --workspace --all-targets -- -D warnings

  # main holds the unsolved exercises, so its tests fail on purpose.
  # Everywhere else (the solutions branch, your own branches, pull requests)
  # the tests must pass. See docs/adr/0002-solutions-on-a-branch.md.
  test:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
      - name: Install uv
        run: pipx install uv
      - name: Install Node packages
        run: npm ci
      - run: ./scripts/check

  # Stage 1 promises PHP 8.3 support (ADR 0001); stage 2 needs 8.4 (ADR 0003).
  stage-1-php-8-3:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Stage 1 PHP tests on PHP 8.3
        run: for n in 01 02 03 04 05 06 07 08 09; do ./scripts/check "$n" php || exit 1; done
